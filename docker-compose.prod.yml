# ==============================================================================
# Docker Compose برای سرور پروداکشن (VPS Production Deployment)
# ایمیج‌ها از GitHub Container Registry (GHCR) فراخوانی می‌شوند
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # دیتابیس PostgreSQL (ایزوله کامل و بدون انتشار پورت به اینترنت)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: velox-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal-net

  # ----------------------------------------------------------------------------
  # اجرای امن مایگریشن‌های پایگاه داده قبل از شروع وب‌سرور
  # ----------------------------------------------------------------------------
  migration:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/velox-backend:latest
    container_name: velox-migration-prod
    command: npx prisma migrate deploy
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal-net

  # ----------------------------------------------------------------------------
  # بک‌اند API (NestJS)
  # ----------------------------------------------------------------------------
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/velox-backend:latest
    container_name: velox-backend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      FORCE_REAL_SMS: "true"
      # مسیر ارسال کد یک‌بار مصرف روی سرور: همیشه پیامک واقعی از طریق API ملی‌پیامک
      SMS_DELIVERY_MODE: "real"
      PORT: 3001
      API_PREFIX: ${API_PREFIX:-api/v1}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-velox_session_token}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-2592000}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-120}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      TWO_FACTOR_TTL_SECONDS: ${TWO_FACTOR_TTL_SECONDS:-300}
      MELIPAYAMAK_USERNAME: ${MELIPAYAMAK_USERNAME:-9134761097}
      MELIPAYAMAK_PASSWORD: ${MELIPAYAMAK_PASSWORD:-!Admin@2793}
      MELIPAYAMAK_OTP_BODY_ID: ${MELIPAYAMAK_OTP_BODY_ID:-556130}
      MELIPAYAMAK_ORDER_PATTERN_ID: ${MELIPAYAMAK_ORDER_PATTERN_ID:-563237}
      MELIPAYAMAK_CUSTOMER_ORDER_PATTERN_ID: ${MELIPAYAMAK_CUSTOMER_ORDER_PATTERN_ID:-563239}
      MELIPAYAMAK_ORDER_SHIPPED_PATTERN_ID: ${MELIPAYAMAK_ORDER_SHIPPED_PATTERN_ID:-546532}
      MELIPAYAMAK_OTP_API_KEY: ${MELIPAYAMAK_OTP_API_KEY:-35a1295420244314a52a34bbd2b0ed7b}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:-${FRONTEND_URL}}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - uploads_prod_data:/app/uploads
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      internal-net:
      proxy-net:
        aliases:
          - backend
          - velox-backend-prod

  # ----------------------------------------------------------------------------
  # فرانت‌اند Next.js Standalone
  # ----------------------------------------------------------------------------
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/velox-frontend:latest
    container_name: velox-frontend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_INTERNAL_URL: "http://velox-backend-prod:3001"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    volumes:
      - uploads_prod_data:/app/public/uploads:ro
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      proxy-net:
        aliases:
          - frontend
          - velox-frontend-prod

  # ----------------------------------------------------------------------------
  # پروکسی معکوس و صدور خودکار SSL با Caddy
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: velox-caddy-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # برای پروتکل HTTP/3 QUIC
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - uploads_prod_data:/var/www/uploads:ro
    depends_on:
      - frontend
      - backend
    networks:
      - proxy-net

# ------------------------------------------------------------------------------
# ولوم‌های پایدار (Persistent Storage)
# ------------------------------------------------------------------------------
volumes:
  postgres_prod_data:
    name: velox_postgres_prod_data
  uploads_prod_data:
    name: velox_uploads_prod_data
  caddy_data:
    name: velox_caddy_data
  caddy_config:
    name: velox_caddy_config

# ------------------------------------------------------------------------------
# شبکه‌ها (ایزوله‌سازی امنیتی کامل)
# ------------------------------------------------------------------------------
networks:
  # شبکه داخلی؛ دیتابیس به اینترنت یا سایر سرویس‌ها دسترسی مستقیم ندارد
  internal-net:
    driver: bridge
    internal: true
  # شبکه ارتباطی بین Caddy و وب‌سرویس‌ها
  proxy-net:
    driver: bridge
