services:
  # Local Development with Hot-Reload
  frontend-dev:
    container_name: ecommerce-frontend-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    command: npm run dev
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./next.config.ts:/app/next.config.ts
      - /app/node_modules
      - /app/.next

  # Staging / Production Standalone Runner
  frontend-prod:
    container_name: ecommerce-frontend-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:4000/api}
    restart: unless-stopped
