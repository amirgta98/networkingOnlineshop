name: CD - Build, Push to GHCR & Deploy to VPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ----------------------------------------------------------------------------
  # 1. بیلد کانتینرها در سرورهای قدرتمند گیت‌هاب و انتشار در GHCR
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lower case repository owner
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_FRONTEND=ghcr.io/${OWNER_LC}/velox-frontend" >> $GITHUB_ENV
          echo "IMAGE_BACKEND=ghcr.io/${OWNER_LC}/velox-backend" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # بیلد و پوش تصویر بک‌اند
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # بیلد و پوش تصویر فرانت‌اند
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # 2. اتصال امن SSH به سرور VPS و اعمال بروزرسانی با Downtime نزدیک به صفر
  # ----------------------------------------------------------------------------
  deploy-to-vps:
    name: Deploy to VPS via SSH
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      # دریافت سورس مخزن در این Job ضروری است؛ در غیر این صورت فایل‌های
      # docker-compose.prod.yml و Caddyfile برای آپلود روی سرور وجود ندارند
      - name: Checkout Code
        uses: actions/checkout@v4

      # ایجاد پوشه‌های مقصد و تنظیم دسترسی قبل از آپلود فایل‌ها
      - name: Prepare remote deployment directory and permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          protocol: tcp4
          timeout: 120s
          script: |
            mkdir -p /opt/velox/deploy/caddy
            chmod -R 777 /opt/velox || true
            chmod 666 /var/run/docker.sock || sudo chmod 666 /var/run/docker.sock || true

      # همگام‌سازی فایل‌های اجرای سرور با مخزن گیت
      - name: Sync deployment manifests to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          timeout: 120s
          source: "docker-compose.prod.yml,deploy/caddy/Caddyfile"
          target: "/opt/velox"
          overwrite: true

      # انتقال مستقیم و فشرده تمامی ایمیج‌ها از گیت‌هاب به سرور (بدون نیاز به اینترنت و دانلود در سرور)
      - name: Pull images on runner and stream directly to VPS via SSH
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT || 22 }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          echo "⬇️ دریافت ایمیج‌ها در محیط گیت‌هاب (با پهنای باند پرسرعت بین‌الملل)..."
          echo "${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull postgres:16-alpine
          docker pull caddy:2-alpine
          docker pull "ghcr.io/${OWNER_LC}/velox-backend:latest"
          docker pull "ghcr.io/${OWNER_LC}/velox-frontend:latest"

          echo "🚀 انتقال مستقیم و فشرده تمامی ایمیج‌ها به داکر سرور از طریق SSH..."
          docker save \
            postgres:16-alpine \
            caddy:2-alpine \
            "ghcr.io/${OWNER_LC}/velox-backend:latest" \
            "ghcr.io/${OWNER_LC}/velox-frontend:latest" | \
            gzip -1 | \
            sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "gunzip -c | docker load"

          echo "✅ تمامی ایمیج‌ها با موفقیت در داکر سرور لود شدند."

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          protocol: tcp4
          command_timeout: 45m
          timeout: 120s
          script: |
            set -e
            echo "🚀 راه‌اندازی کانتینرها روی سرور..."
            cd /opt/velox

            OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            export GITHUB_REPOSITORY_OWNER="${OWNER_LC}"

            echo "🔧 بررسی و فعال‌سازی فورواردینگ پکت‌های اینترنت در کرنل لینوکس (ip_forward) با sudo..."
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S sh -c "
              echo 1 > /proc/sys/net/ipv4/ip_forward
              sysctl -w net.ipv4.ip_forward=1
              sed -i 's/#net.ipv4.ip_forward=1/net.ipv4.ip_forward=1/g' /etc/sysctl.conf 2>/dev/null || true
              echo 'net.ipv4.ip_forward=1' > /etc/sysctl.d/99-docker-forward.conf 2>/dev/null || true
              iptables -P FORWARD ACCEPT
              iptables -P OUTPUT ACCEPT
              iptables -t nat -A POSTROUTING ! -d 172.16.0.0/12 -j MASQUERADE 2>/dev/null || true
              which ufw >/dev/null 2>&1 && ufw default allow forward && ufw default allow outgoing && ufw reload || true
            " || true

            echo "🔍 بررسی کانتینرهای در حال اجرا قبل از بازنشانی..."
            docker ps -a || true

            # در صورت تغییر در تنظیمات ساختاری شبکه‌ها، متوقف‌سازی ایمن جهت آزادسازی پورت‌ها و شبکه‌ها
            echo "🔄 متوقف‌سازی کانتینرهای قبلی جهت بازسازی سالم شبکه‌ها..."
            docker compose -f docker-compose.prod.yml down || true

            # اجرای مایگریشن و راه‌اندازی مجدد کانتینرها (بدون هیچ دانلود اینترنتی)
            echo "🔄 اجرای کانتینرها و مایگریشن پایگاه‌داده..."
            docker compose -f docker-compose.prod.yml up -d --pull never --remove-orphans

            # پاکسازی ایمیج‌های قدیمی معلق (Dangling) جهت آزادسازی فضای هارددیسک
            echo "🧹 پاکسازی حافظه دیسک..."
            docker image prune -f

            # نمایش وضعیت نهایی کانتینرها
            echo "✅ وضعیت نهایی سرویس‌ها:"
            docker compose -f docker-compose.prod.yml ps

            echo "📋 جمع‌آوری گزارش عیب‌یابی شبکه در هاست و کانتینر..."
            mkdir -p /tmp/velox_diag
            {
              echo "=== Host sysctl ip_forward ==="
              cat /proc/sys/net/ipv4/ip_forward 2>/dev/null || true
              echo ""
              echo "=== Host curl to payment.zarinpal.com (185.143.234.1:443) ==="
              curl -Iv -m 5 https://payment.zarinpal.com 2>&1 || true
              echo ""
              echo "=== Host curl to shaparak.ir (185.167.73.34:443) ==="
              curl -Iv -m 5 https://shaparak.ir 2>&1 || true
              echo ""
              echo "=== Host curl to console.melipayamak.com (85.198.11.3:443) ==="
              curl -Iv -m 5 https://console.melipayamak.com/api/send 2>&1 || true
              echo ""
              echo "=== Host curl to rest.payamak-panel.com (46.245.77.196:443) ==="
              curl -Iv -m 5 https://rest.payamak-panel.com 2>&1 || true
              echo ""
              echo "=== Container curl to payment.zarinpal.com ==="
              docker exec velox-backend-prod curl -Iv -m 5 https://payment.zarinpal.com 2>&1 || true
              echo ""
              echo "=== Container curl to shaparak.ir ==="
              docker exec velox-backend-prod curl -Iv -m 5 https://shaparak.ir 2>&1 || true
              echo ""
              echo "=== Container curl to console.melipayamak.com ==="
              docker exec velox-backend-prod curl -Iv -m 5 https://console.melipayamak.com/api/send 2>&1 || true
              echo ""
              echo "=== Container curl to rest.payamak-panel.com ==="
              docker exec velox-backend-prod curl -Iv -m 5 https://rest.payamak-panel.com 2>&1 || true
            } > /tmp/velox_diag/diag.txt || true

            docker cp /tmp/velox_diag/diag.txt velox-backend-prod:/app/uploads/diag.txt 2>/dev/null || true

            echo "📋 لاگ‌های اولیه سرویس‌ها جهت صحت‌سنجی بالا آمدن:"
            docker compose -f docker-compose.prod.yml logs --tail=25 caddy backend frontend

