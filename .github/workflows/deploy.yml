name: CD - Build, Push to GHCR & Deploy to VPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/velox-frontend
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/velox-backend

jobs:
  # ----------------------------------------------------------------------------
  # 1. بیلد کانتینرها در سرورهای قدرتمند گیت‌هاب و انتشار در GHCR
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # بیلد و پوش تصویر بک‌اند
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # بیلد و پوش تصویر فرانت‌اند
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # 2. اتصال امن SSH به سرور VPS و اعمال بروزرسانی با Downtime نزدیک به صفر
  # ----------------------------------------------------------------------------
  deploy-to-vps:
    name: Deploy to VPS via SSH
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 شروع دیپلوی نسخه جدید روی سرور..."
            cd /opt/velox

            # لاگین به رجیستری جهت دریافت ایمیج‌های پکیج گیت‌هاب
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # دریافت آخرین نسخه‌های بیلد شده
            echo "📥 دریافت آخرین تصاویر کانتینرها..."
            docker compose -f docker-compose.prod.yml pull

            # اجرای مایگریشن و راه‌اندازی مجدد کانتینرها
            echo "🔄 اجرای کانتینرها و مایگریشن..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # پاکسازی ایمیج‌های قدیمی معلق (Dangling) جهت آزادسازی فضای هارددیسک
            echo "🧹 پاکسازی حافظه دیسک..."
            docker image prune -f

            # نمایش وضعیت نهایی کانتینرها
            echo "✅ وضعیت سرویس‌ها:"
            docker compose -f docker-compose.prod.yml ps
