name: CD - Build, Push to GHCR & Deploy to VPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ----------------------------------------------------------------------------
  # 1. بیلد کانتینرها در سرورهای قدرتمند گیت‌هاب و انتشار در GHCR
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lower case repository owner
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_FRONTEND=ghcr.io/${OWNER_LC}/velox-frontend" >> $GITHUB_ENV
          echo "IMAGE_BACKEND=ghcr.io/${OWNER_LC}/velox-backend" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # بیلد و پوش تصویر بک‌اند
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # بیلد و پوش تصویر فرانت‌اند
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # 2. اتصال امن SSH به سرور VPS و اعمال بروزرسانی با Downtime نزدیک به صفر
  # ----------------------------------------------------------------------------
  deploy-to-vps:
    name: Deploy to VPS via SSH
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          protocol: tcp4
          command_timeout: 45m
          timeout: 120s
          script: |
            set -e
            echo "🚀 شروع دیپلوی نسخه جدید روی سرور..."
            cd /opt/velox

            OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            export GITHUB_REPOSITORY_OWNER="${OWNER_LC}"

            # آزادسازی فضای هارد دیسک سرور قبل از شروع دانلود لایه‌ها
            echo "🧹 آزادسازی فضای دیسک سرور..."
            docker image prune -f || true

            # لاگین به رجیستری جهت دریافت ایمیج‌های پکیج گیت‌هاب
            echo "${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # تابع دانلود ایمیج با محدودیت زمانی ۶۰۰ ثانیه (۱۰ دقیقه) و مکانیزم تلاش مجدد
            # مهلت ۱۰ دقیقه‌ای به لایه‌های بزرگ (مثل node_modules و Prisma) فرصت می‌دهد با موفقیت دانلود شوند
            pull_with_retry() {
              local image="$1"
              local max_attempts=3
              local attempt=1
              while [ $attempt -le $max_attempts ]; do
                echo "⬇️ دریافت ایمیج $image (تلاش $attempt از $max_attempts)..."
                if command -v timeout >/dev/null 2>&1; then
                  if timeout 600 docker pull "$image"; then
                    echo "✅ ایمیج $image با موفقیت دریافت شد."
                    return 0
                  fi
                else
                  if docker pull "$image"; then
                    echo "✅ ایمیج $image با موفقیت دریافت شد."
                    return 0
                  fi
                fi
                echo "⚠️ دریافت $image با وقفه مواجه شد (احتمال افت سرعت ارتباط بین‌الملل). تلاش مجدد پس از ۵ ثانیه..."
                sleep 5
                attempt=$((attempt + 1))
              done
              echo "❌ خطا: دریافت $image پس از $max_attempts تلاش ناموفق بود."
              return 1
            }

            # دریافت تصاویر کانتینرها به صورت ترتیبی و مجزا جهت جلوگیری از اشباع پهنای باند
            echo "📥 دریافت آخرین تصاویر کانتینرها به صورت ترتیبی..."
            pull_with_retry "postgres:16-alpine"
            pull_with_retry "caddy:2-alpine"
            pull_with_retry "ghcr.io/${OWNER_LC}/velox-backend:latest"
            pull_with_retry "ghcr.io/${OWNER_LC}/velox-frontend:latest"

            # اجرای مایگریشن و راه‌اندازی مجدد کانتینرها
            echo "🔄 اجرای کانتینرها و مایگریشن..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # پاکسازی ایمیج‌های قدیمی معلق (Dangling) جهت آزادسازی فضای هارددیسک
            echo "🧹 پاکسازی حافظه دیسک..."
            docker image prune -f

            # نمایش وضعیت نهایی کانتینرها
            echo "✅ وضعیت سرویس‌ها:"
            docker compose -f docker-compose.prod.yml ps

