# ==============================================================================
# پیکربندی سایت‌ها در Nginx با Certbot (Let's Encrypt)
# ==============================================================================

# ریدایرکت خودکار ترافیک HTTP به HTTPS
server {
    listen 80;
    server_name domain.ir api.domain.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 1. دامنه فرانت‌اند (Next.js)
server {
    listen 443 ssl http2;
    server_name domain.ir;

    ssl_certificate /etc/letsencrypt/live/domain.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domain.ir/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. ساب‌دامین بک‌اند (NestJS API)
server {
    listen 443 ssl http2;
    server_name api.domain.ir;

    ssl_certificate /etc/letsencrypt/live/domain.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domain.ir/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # سرو مستقیم فایل‌های آپلود شده
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
