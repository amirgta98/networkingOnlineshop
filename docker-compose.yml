# ==============================================================================
# Docker Compose برای محیط لوکال و توسعه (Local Development)
# این فایل سرویس‌ها را با سورس کدهای محلی بیلد و اجرا می‌کند
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # پایگاه داده PostgreSQL
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: velox-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-velox_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # پورت 5433 در محیط لوکال باز است تا تداخلی با سرویس لوکال 5432 نداشته باشد
      - "5433:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-velox_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - velox-local-net

  # ----------------------------------------------------------------------------
  # کانتینر اجرای اتوماتیک Migration (یک‌بار اجرا شونده)
  # ----------------------------------------------------------------------------
  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: velox-migration-local
    command: npx prisma migrate deploy
    restart: "no"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-velox_db}?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - velox-local-net

  # ----------------------------------------------------------------------------
  # سرویس بک‌اند (NestJS API)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: velox-backend-local
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      FORCE_REAL_SMS: ${FORCE_REAL_SMS:-}
      # حالت ارسال کد تایید در محیط لوکال: telegram (ربات) یا real (پیامک واقعی)
      # مقدار پیش‌فرض عمداً خالی است تا این فایل روی سرور به‌اشتباه حالت لوکال را فعال نکند
      SMS_DELIVERY_MODE: ${SMS_DELIVERY_MODE:-}
      PORT: 3001
      API_PREFIX: api/v1
      USE_PRISMA_REPO: "true"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-velox_db}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key_12345}
      SESSION_SECRET: ${SESSION_SECRET:-velox-session-secret-key-32-chars-long-development-grade}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-velox_session_token}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-2592000}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-120}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      TWO_FACTOR_TTL_SECONDS: ${TWO_FACTOR_TTL_SECONDS:-300}
      MELIPAYAMAK_USERNAME: ${MELIPAYAMAK_USERNAME:-}
      MELIPAYAMAK_PASSWORD: ${MELIPAYAMAK_PASSWORD:-}
      MELIPAYAMAK_OTP_BODY_ID: ${MELIPAYAMAK_OTP_BODY_ID:-}
      MELIPAYAMAK_ORDER_PATTERN_ID: ${MELIPAYAMAK_ORDER_PATTERN_ID:-563237}
      MELIPAYAMAK_CUSTOMER_ORDER_PATTERN_ID: ${MELIPAYAMAK_CUSTOMER_ORDER_PATTERN_ID:-563239}
      MELIPAYAMAK_ORDER_SHIPPED_PATTERN_ID: ${MELIPAYAMAK_ORDER_SHIPPED_PATTERN_ID:-546532}
      MELIPAYAMAK_OTP_API_KEY: ${MELIPAYAMAK_OTP_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      FRONTEND_URL: "http://localhost:3000"
      CORS_ORIGIN: "http://localhost:3000"
    volumes:
      - uploads_local_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - velox-local-net

  # ----------------------------------------------------------------------------
  # سرویس فرانت‌اند (Next.js)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    container_name: velox-frontend-local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_INTERNAL_URL: "http://backend:3001"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    volumes:
      - uploads_local_data:/app/public/uploads:ro
    depends_on:
      - backend
    networks:
      - velox-local-net

# ------------------------------------------------------------------------------
# ولوم‌ها و شبکه‌ها
# ------------------------------------------------------------------------------
volumes:
  postgres_local_data:
    name: velox_postgres_local_data
  uploads_local_data:
    name: velox_uploads_local_data

networks:
  velox-local-net:
    driver: bridge
